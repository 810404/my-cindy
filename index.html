<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt 黃金公式組合台</title>
    <!-- 載入 Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Shippori+Mincho:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f5f3ee;
            --card-bg: #ffffff;
            --border-color: #d8d4cb;
            --primary-color: #b5703a;
            --result-bg: #2c2b28;
            --result-text: #f5f3ee;
            --placeholder-color: #a09a8e;
            --radius: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Noto Sans TC', sans-serif;
            color: #4a453e;
            line-height: 1.6;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        h1 {
            font-family: 'Shippori Mincho', serif;
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 40px;
            font-size: 2.5rem;
            letter-spacing: 0.1em;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 30px;
            margin-bottom: 30px;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 30px;
        }

        /* 響應式：手機版改為單欄 */
        @media (max-width: 600px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .label {
            font-weight: 700;
            margin-bottom: 8px;
            color: #2c2b28;
            font-size: 0.95rem;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 1rem;
            resize: vertical;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        textarea::placeholder {
            color: var(--placeholder-color);
            font-size: 0.9rem;
            font-weight: 400;
        }

        .btn-container {
            display: flex;
            justify-content: center;
        }

        .btn-combine {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: var(--radius);
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .btn-combine:hover {
            opacity: 0.9;
        }

        .btn-combine:active {
            transform: translateY(1px);
        }

        .result-section {
            display: none; /* 初始隱藏 */
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .result-title {
            font-family: 'Shippori Mincho', serif;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .result-box-container {
            position: relative;
        }

        .result-box {
            background-color: var(--result-bg);
            color: var(--result-text);
            padding: 24px;
            border-radius: var(--radius);
            white-space: pre-wrap;
            word-break: break-all;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.95rem;
            min-height: 100px;
            line-height: 1.7;
        }

        .btn-copy {
            background-color: #4a453e;
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-copy:hover {
            background-color: #5e584f;
        }

        .copy-status {
            font-size: 0.8rem;
            color: var(--primary-color);
            margin-left: 10px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .copy-status.visible {
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Prompt 黃金公式組合台</h1>

    <div class="card">
        <div class="grid-layout">
            <div class="form-group">
                <label class="label" for="role">① 角色 (Role)</label>
                <textarea id="role" placeholder="例如：你是一位資深的行銷顧問，擅長撰寫吸引人的社群文案..."></textarea>
            </div>
            <div class="form-group">
                <label class="label" for="task">② 任務 (Task)</label>
                <textarea id="task" placeholder="例如：請幫我針對「新款環保咖啡杯」撰寫三組 Facebook 貼文文案..."></textarea>
            </div>
            <div class="form-group">
                <label class="label" for="constraint">③ 限制 (Constraint)</label>
                <textarea id="constraint" placeholder="例如：每則不超過 200 字、語氣要親切幽默、必須包含三個表情符號..."></textarea>
            </div>
            <div class="form-group">
                <label class="label" for="format">④ 呈現 (Format)</label>
                <textarea id="format" placeholder="例如：請使用條列式呈現，並在結尾加上適當的標籤（Hashtags）..."></textarea>
            </div>
        </div>

        <div class="btn-container">
            <button class="btn-combine" onclick="combinePrompt()">組合成完整 Prompt</button>
        </div>
    </div>

    <div id="resultSection" class="result-section">
        <div class="result-header">
            <span class="result-title">組合結果</span>
            <div style="display: flex; align-items: center;">
                <span id="copyStatus" class="copy-status">已複製！</span>
                <button class="btn-copy" onclick="copyToClipboard()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    複製內容
                </button>
            </div>
        </div>
        <div class="result-box-container">
            <div id="resultBox" class="result-box"></div>
        </div>
    </div>
</div>

<script>
    function combinePrompt() {
        const role = document.getElementById('role').value.trim();
        const task = document.getElementById('task').value.trim();
        const constraint = document.getElementById('constraint').value.trim();
        const format = document.getElementById('format').value.trim();

        if (!role && !task && !constraint && !format) {
            return;
        }

        let combined = "";
        if (role) combined += `【角色】\n${role}\n\n`;
        if (task) combined += `【任務】\n${task}\n\n`;
        if (constraint) combined += `【限制】\n${constraint}\n\n`;
        if (format) combined += `【呈現】\n${format}`;

        const resultBox = document.getElementById('resultBox');
        const resultSection = document.getElementById('resultSection');

        resultBox.innerText = combined.trim();
        resultSection.style.display = 'block';

        // 捲動到結果區
        resultSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function copyToClipboard() {
        const text = document.getElementById('resultBox').innerText;
        
        // 建立臨時 textarea 用於複製
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        
        try {
            document.execCommand('copy');
            showCopyFeedback();
        } catch (err) {
            console.error('無法複製', err);
        }
        
        document.body.removeChild(textArea);
    }

    function showCopyFeedback() {
        const status = document.getElementById('copyStatus');
        status.classList.add('visible');
        setTimeout(() => {
            status.classList.remove('visible');
        }, 2000);
    }
</script>

</body>
</html>
