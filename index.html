<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自動化提案進階 ROI 試算器</title>
    <!-- 引入 Google Fonts 提升排版質感 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* 設計語彙與變數設定 */
        :root {
            --primary-color: #6b7fa3;       /* 霧藍 */
            --primary-hover: #56698c;       /* 霧藍深色版 */
            --bg-color: #f5f3ee;            /* 米白 */
            --card-bg: #ffffff;             /* 純白卡片 */
            --text-color: #2c3e50;          /* 內文深灰 */
            --text-muted: #7f8c8d;          /* 提示淺灰 */
            --border-color: #dcd6cd;        /* 邊框淺灰 */
            --accent-color: #e74c3c;        /* 警示紅 */
            --success-color: #27ae60;       /* 成功綠 */
            --warning-color: #f39c12;       /* 警告黃 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        /* 容器設計 */
        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 640px;
            padding: 30px 25px;
            border: 1px solid var(--border-color);
            margin: 20px auto;
        }

        /* 標題與說明 */
        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* 參數說明面板 */
        .params-panel {
            background-color: #faf8f5;
            border-left: 4px solid var(--primary-color);
            padding: 12px 15px;
            margin-bottom: 25px;
            border-radius: 0 8px 8px 0;
            font-size: 0.85rem;
            color: #5d6d7e;
        }

        /* 網格輸入欄位 */
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 20px;
            margin-bottom: 25px;
        }

        @media (max-width: 480px) {
            .input-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
        }

        /* 表單元素 */
        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 500;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #34495e;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-control {
            width: 100%;
            padding: 10px 45px 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            color: var(--text-color);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            background-color: #fafbfc;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(107, 127, 163, 0.15);
            background-color: #ffffff;
        }

        .unit {
            position: absolute;
            right: 14px;
            color: var(--text-muted);
            font-size: 0.85rem;
            pointer-events: none;
        }

        /* 按鈕設計 */
        .btn-calc {
            width: 100%;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(107, 127, 163, 0.2);
        }

        .btn-calc:hover {
            background-color: var(--primary-hover);
        }

        .btn-calc:active {
            transform: scale(0.98);
        }

        /* 輸出區設計 */
        .output-card {
            border-top: 2px dashed var(--border-color);
            padding-top: 25px;
        }

        .output-card h2 {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 錯誤提示 */
        .error-message {
            color: var(--text-muted);
            text-align: center;
            font-size: 0.95rem;
            padding: 30px 0;
            font-style: italic;
        }

        /* 卡片三欄排版 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (max-width: 560px) {
            .cards-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }

        .stat-card {
            background: #faf8f5;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px 10px;
            text-align: center;
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .stat-val {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-color);
            word-break: break-word;
        }

        .stat-val.highlight {
            color: var(--primary-color);
        }

        /* 主管摘要 */
        .summary-section {
            background-color: #f0f4f8;
            border-left: 4px solid var(--primary-color);
            border-radius: 4px 8px 8px 4px;
            padding: 20px;
            margin-top: 15px;
            position: relative;
        }

        .summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .summary-title {
            font-weight: 700;
            color: #435470;
            font-size: 0.95rem;
        }

        .btn-copy {
            background-color: #ffffff;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-copy:hover {
            background-color: var(--primary-color);
            color: #ffffff;
        }

        .summary-body {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #2c3e50;
            white-space: pre-wrap; /* 保持換行格式 */
        }

        /* 回饋浮窗 */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: rgba(44, 62, 80, 0.9);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            transition: transform 0.3s ease;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 標題 -->
        <div class="header">
            <h1>自動化提案 ROI 試算器</h1>
            <p>考量返工成本、自動化後抽查機制，提供主管決策最精準的 ROI 報告</p>
        </div>

        <!-- 參數說明面板 -->
        <div class="params-panel">
            <strong>系統進階邏輯：</strong><br>
            • 自動化後，預設需配套 <strong>10% 人工抽查</strong>（複核）機制。<br>
            • 每月省下工時將依 <strong>1 工作天 = 8 小時</strong> 折算。
        </div>

        <!-- 輸入欄位 -->
        <form id="roiForm" onsubmit="return false;">
            <div class="input-grid">
                
                <div class="form-group">
                    <label for="monthlyCases">每月案件數</label>
                    <div class="input-wrapper">
                        <input type="number" id="monthlyCases" class="form-control" value="1200" min="0" required placeholder="例如: 1200">
                        <span class="unit">件</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="minsPerCase">每件人工處理時間</label>
                    <div class="input-wrapper">
                        <input type="number" id="minsPerCase" class="form-control" value="3" min="0" step="any" required placeholder="例如: 3">
                        <span class="unit">分鐘</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="hourlyRate">執行者時薪</label>
                    <div class="input-wrapper">
                        <input type="number" id="hourlyRate" class="form-control" value="250" min="0" required placeholder="例如: 250">
                        <span class="unit">TWD</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="currentErrorRate">目前錯誤率</label>
                    <div class="input-wrapper">
                        <input type="number" id="currentErrorRate" class="form-control" value="8" min="0" max="100" step="any" required placeholder="例如: 8">
                        <span class="unit">%</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reworkMins">每次錯誤返工時間</label>
                    <div class="input-wrapper">
                        <input type="number" id="reworkMins" class="form-control" value="5" min="0" step="any" required placeholder="例如: 5">
                        <span class="unit">分鐘</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="newErrorRate">自動化預估錯誤率</label>
                    <div class="input-wrapper">
                        <input type="number" id="newErrorRate" class="form-control" value="15" min="0" max="100" step="any" required placeholder="例如: 15">
                        <span class="unit">%</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="monthlyToolFee">每月工具費</label>
                    <div class="input-wrapper">
                        <input type="number" id="monthlyToolFee" class="form-control" value="800" min="0" required placeholder="例如: 800">
                        <span class="unit">TWD</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="setupHours">一次性建置工時</label>
                    <div class="input-wrapper">
                        <input type="number" id="setupHours" class="form-control" value="12" min="0" required placeholder="例如: 12">
                        <span class="unit">小時</span>
                    </div>
                </div>

            </div>

            <!-- 全寬計算按鈕 -->
            <button type="button" id="btnCalculate" class="btn-calc">開始試算 ROI</button>
        </form>

        <!-- 輸出區 -->
        <div class="output-card">
            <h2>試算分析結果</h2>
            
            <!-- 錯誤提示區 -->
            <div id="errorBox" class="error-message">
                請檢查欄位是否都填了數字
            </div>

            <!-- 計算結果展示區 -->
            <div id="resultArea" style="display: none;">
                
                <!-- 三張卡片 -->
                <div class="cards-grid">
                    <div class="stat-card">
                        <div class="stat-title">每月節省成本</div>
                        <div class="stat-val highlight" id="savedCost">TWD 0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">回本所需時間</div>
                        <div class="stat-val" id="paybackPeriod">0 個月</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">每月省下工時</div>
                        <div class="stat-val" id="savedHours">0 天</div>
                    </div>
                </div>

                <!-- 主管摘要 -->
                <div class="summary-section">
                    <div class="summary-header">
                        <span class="summary-title">📝 主管摘要報告（一鍵複製）</span>
                        <button type="button" class="btn-copy" id="btnCopy">複製文字</button>
                    </div>
                    <div class="summary-body" id="summaryText">建議 [載入中]...</div>
                </div>

            </div>
        </div>
    </div>

    <!-- 複製成功提示 -->
    <div id="toast" class="toast">已複製到剪貼簿！</div>

    <script>
        // DOM 元素繫結
        const btnCalculate = document.getElementById('btnCalculate');
        const errorBox = document.getElementById('errorBox');
        const resultArea = document.getElementById('resultArea');
        const btnCopy = document.getElementById('btnCopy');
        const toast = document.getElementById('toast');

        // 千分位格式化函數
        function formatCurrency(num) {
            return Math.round(num).toLocaleString('zh-TW');
        }

        // 複製至剪貼簿函數 (考量 iframe 限制使用傳統方式)
        function copyToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";  // 避免滾動頁面
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                console.error('無法複製文字: ', err);
            }
            document.body.removeChild(textArea);
        }

        // 顯示複製成功 Toast 
        function showToast() {
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // 計算邏輯
        function calculateROI() {
            // 讀取輸入欄位值
            const monthlyCasesVal = document.getElementById('monthlyCases').value;
            const minsPerCaseVal = document.getElementById('minsPerCase').value;
            const hourlyRateVal = document.getElementById('hourlyRate').value;
            const currentErrorRateVal = document.getElementById('currentErrorRate').value;
            const reworkMinsVal = document.getElementById('reworkMins').value;
            const newErrorRateVal = document.getElementById('newErrorRate').value;
            const monthlyToolFeeVal = document.getElementById('monthlyToolFee').value;
            const setupHoursVal = document.getElementById('setupHours').value;

            // 錯誤處理：任何欄位空白、不是有效數字、或是負數
            if (
                monthlyCasesVal === '' || isNaN(monthlyCasesVal) || parseFloat(monthlyCasesVal) < 0 ||
                minsPerCaseVal === '' || isNaN(minsPerCaseVal) || parseFloat(minsPerCaseVal) < 0 ||
                hourlyRateVal === '' || isNaN(hourlyRateVal) || parseFloat(hourlyRateVal) < 0 ||
                currentErrorRateVal === '' || isNaN(currentErrorRateVal) || parseFloat(currentErrorRateVal) < 0 || parseFloat(currentErrorRateVal) > 100 ||
                reworkMinsVal === '' || isNaN(reworkMinsVal) || parseFloat(reworkMinsVal) < 0 ||
                newErrorRateVal === '' || isNaN(newErrorRateVal) || parseFloat(newErrorRateVal) < 0 || parseFloat(newErrorRateVal) > 100 ||
                monthlyToolFeeVal === '' || isNaN(monthlyToolFeeVal) || parseFloat(monthlyToolFeeVal) < 0 ||
                setupHoursVal === '' || isNaN(setupHoursVal) || parseFloat(setupHoursVal) < 0
            ) {
                // 顯示灰字錯誤提示，隱藏結果區
                errorBox.style.display = 'block';
                resultArea.style.display = 'none';
                return;
            }

            // 轉成浮點數以便計算
            const monthlyCases = parseFloat(monthlyCasesVal);
            const minsPerCase = parseFloat(minsPerCaseVal);
            const hourlyRate = parseFloat(hourlyRateVal);
            const currentErrorRate = parseFloat(currentErrorRateVal);
            const reworkMins = parseFloat(reworkMinsVal);
            const newErrorRate = parseFloat(newErrorRateVal);
            const monthlyToolFee = parseFloat(monthlyToolFeeVal);
            const setupHours = parseFloat(setupHoursVal);

            // ================== 運算公式 ==================
            // 1. 每月人工成本 = 案件數 × 人工分鐘 / 60 × 時薪
            const monthlyCost = (monthlyCases * minsPerCase) / 60 * hourlyRate;

            // 2. 目前返工成本 = 案件數 × (錯誤率/100) × 返工分鐘 / 60 × 時薪
            const currentReworkCost = monthlyCases * (currentErrorRate / 100) * reworkMins / 60 * hourlyRate;

            // 3. 自動化後返工 = 案件數 × (新錯誤率/100) × 返工分鐘 / 60 × 時薪
            const newReworkCost = monthlyCases * (newErrorRate / 100) * reworkMins / 60 * hourlyRate;

            // 4. 自動化後人工複核 = 每月人工成本 × 10%
            const auditCost = monthlyCost * 0.10;

            // 5. 每月節省 = (人工成本 + 目前返工) − (自動化複核 + 自動化返工 + 工具費)
            const monthlySavings = (monthlyCost + currentReworkCost) - (auditCost + newReworkCost + monthlyToolFee);

            // 6. 回本月數 = 建置工時 × 時薪 / 每月節省
            let paybackMonthsText = '';
            let paybackMonths = 0;
            if (monthlySavings > 0) {
                paybackMonths = (setupHours * hourlyRate) / monthlySavings;
                paybackMonthsText = `${paybackMonths.toFixed(1)} 個月`;
            } else {
                paybackMonthsText = '不回本';
            }

            // 7. 每月省下工時 (折算成工作天: 1 天 = 8 小時)
            // 省下工時 = 原人工工時 + 原返工工時 - 自動化複核工時(原人工10%) - 新返工工時
            const originalHours = (monthlyCases * minsPerCase) / 60;
            const originalReworkHours = (monthlyCases * (currentErrorRate / 100) * reworkMins) / 60;
            const auditHours = originalHours * 0.10;
            const newReworkHours = (monthlyCases * (newErrorRate / 100) * reworkMins) / 60;

            const netSavedHours = (originalHours + originalReworkHours) - (auditHours + newReworkHours);
            const savedDays = netSavedHours / 8; // 折算工作天數

            // ================== 渲染畫面 ==================
            errorBox.style.display = 'none';
            resultArea.style.display = 'block';

            // 1. 每月節省 TWD 卡片
            document.getElementById('savedCost').textContent = `TWD ${formatCurrency(monthlySavings)}`;
            
            // 2. 回本月數卡片
            document.getElementById('paybackPeriod').textContent = paybackMonthsText;

            // 3. 每月省下工時 (折合天數) 卡片
            document.getElementById('savedHours').textContent = `${savedDays.toFixed(1)} 天`;

            // ================== 主管摘要 & 建議判定 ==================
            // 判定建議：
            // - 若不回本或每月省下為負：暫緩
            // - 若 3 個月內回本：做
            // - 若大於 3 個月回本：待評估
            let recommendation = '待評估';
            if (monthlySavings <= 0) {
                recommendation = '暫緩';
            } else if (paybackMonths <= 3) {
                recommendation = '做';
            } else {
                recommendation = '待評估';
            }

            // 組織主管摘要文本
            const summaryString = 
`建議 [ ${recommendation} ]：
每月預期淨節省 ${formatCurrency(monthlySavings)} TWD（折合約 ${savedDays.toFixed(1)} 個工作天），預計 ${paybackMonthsText === '不回本' ? '不回本' : `${paybackMonths.toFixed(1)} 個月回本`}。

【風險提示】
自動化後預估錯誤率較高（${newErrorRate}% vs 目前 ${currentErrorRate}%），需配套 10% 人工抽查機制以確保品質控管。`;

            // 寫入摘要區
            document.getElementById('summaryText').textContent = summaryString;
        }

        // 綁定按鈕與事件
        btnCalculate.addEventListener('click', calculateROI);
        btnCopy.addEventListener('click', () => {
            const textToCopy = document.getElementById('summaryText').textContent;
            copyToClipboard(textToCopy);
        });

        // 初始化自動執行一次
        window.addEventListener('DOMContentLoaded', () => {
            calculateROI();
        });
    </script>
</body>
</html>
